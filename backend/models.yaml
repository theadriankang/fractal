# Model catalogue — maps front-end model ids (src/data/models.js) to providers
# and their real provider model names. Edit this file to change model names or
# add new models without touching code.
#
# Routing rules (backend/app/llm/registry.py):
#   - provider "anthropic"  → Anthropic SDK directly (ANTHROPIC_API_KEY)
#   - provider "tencent"    → HUNYUAN_API_KEY + HUNYUAN_BASE_URL when set,
#                             otherwise OpenRouter (OPENROUTER_API_KEY)
#   - all other providers    → OpenRouter via LiteLLM (OPENROUTER_API_KEY)

models:
  - id: claude-opus
    provider: anthropic
    model: claude-opus-5-5

  - id: claude-sonnet
    provider: anthropic
    model: claude-sonnet-5-5

  - id: claude-haiku
    provider: anthropic
    model: claude-haiku-5-5

  - id: gpt-5
    provider: openai
    model: openai/gpt-5

  - id: gpt-5-mini
    provider: openai
    model: openai/gpt-5-mini

  - id: gemini-pro
    provider: google
    model: google/gemini-2.5-pro

  - id: gemini-flash
    provider: google
    model: google/gemini-2.5-flash

  - id: grok-4
    provider: xai
    model: x-ai/grok-4

  - id: grok-fast
    provider: xai
    model: x-ai/grok-fast

  - id: hunyuan-t1
    provider: tencent
    model: hunyuan-t1
    # When HUNYUAN_API_KEY is set, this model is called via the OpenAI-compatible
    # endpoint at HUNYUAN_BASE_URL using this exact model name.
    hunyuan_model: hunyuan-t1

  - id: hunyuan-turbos
    provider: tencent
    model: tencent/hunyuan-turbos
    hunyuan_model: hunyuan-turbos

  - id: deepseek-v3
    provider: deepseek
    model: deepseek/deepseek-chat
